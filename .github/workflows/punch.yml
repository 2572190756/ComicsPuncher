name: Comic Punch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  punch:
    runs-on: ubuntu-latest
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Punch in
        run: python main.py
